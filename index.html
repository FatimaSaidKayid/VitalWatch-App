<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="VitalWatch - Clinical Monitoring. Early Detection. Faster Response." />
  <meta name="theme-color" content="#0e7490" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="VitalWatch" />
  <title>VitalWatch</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="./assets/app.css" />
</head>
<body>
  <div id="root"></div>
  <script defer src="./assets/app.js"></script>
  <script>
    if ("serviceWorker" in navigator && location.protocol !== "file:" && !location.protocol.startsWith("capacitor")) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
